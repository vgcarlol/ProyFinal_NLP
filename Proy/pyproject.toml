[project]
name = "laboragt"
version = "0.1.0"
description = "Asistente RAG agéntico de legislación laboral guatemalteca (CC3103 - NLP, UVG)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
